spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5433/personaldata
    username: ${DB_USERNAME:personaldata}
    password: ${DB_PASSWORD:personaldata}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

server:
  port: 8082
  servlet:
    context-path: /product

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

dummyjson:
  base-url: ${DUMMYJSON_BASE_URL:https://dummyjson.com}
