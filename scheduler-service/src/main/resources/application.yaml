spring:
  application:
    name: scheduler-service

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

dummyjson:
  base-url: ${DUMMYJSON_BASE_URL:https://dummyjson.com}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topic:
    product-created: product-created
  consumer:
    group-id: product-created-consumer
